<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节气诗境 · 唐宋元明清节气诗词意象</title>
<style>
:root{
  --paper:#f8f4ea; --paper2:#fdfbf5; --ink:#2c2a26; --ink2:#6b675e; --line:#e3dcc9;
  --spring:#5a8a6a; --summer:#b5543b; --autumn:#b98a2e; --winter:#4a6b8a;
  --seal:#a03a2a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;line-height:1.8}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:50;background:rgba(248,244,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;height:60px}
.brand{font-size:20px;font-weight:700;letter-spacing:4px}
.brand small{font-size:12px;color:var(--ink2);letter-spacing:1px;margin-left:8px}
.nav-links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-links a{padding:6px 14px;border-radius:20px;font-size:14px;color:var(--ink2);transition:.2s;cursor:pointer}
.nav-links a:hover,.nav-links a.on{background:var(--ink);color:var(--paper)}

/* ── 首屏 ── */
.hero{padding:88px 0 64px;text-align:center;position:relative}
.hero h1{font-size:44px;letter-spacing:12px;font-weight:700}
.hero .sub{margin-top:14px;color:var(--ink2);font-size:15px;letter-spacing:3px}
.hero .nums{margin-top:34px;display:flex;justify-content:center;gap:56px}
.hero .nums div b{display:block;font-size:30px;color:var(--seal)}
.hero .nums div span{font-size:13px;color:var(--ink2);letter-spacing:2px}
.seal{display:inline-block;width:52px;height:52px;line-height:52px;background:var(--seal);color:#fff;border-radius:6px;font-size:15px;letter-spacing:0;margin-bottom:18px;writing-mode:vertical-rl;text-align:center;padding:4px 0}
.divider{width:64px;height:2px;background:var(--ink);margin:26px auto 0;opacity:.5}

/* ── 季节与节气卡 ── */
.season-head{display:flex;align-items:baseline;gap:16px;margin:56px 0 8px}
.season-head h2{font-size:28px;letter-spacing:6px}
.season-head .tag{font-size:13px;color:var(--ink2)}
.season-head .rule{flex:1;height:1px;background:var(--line)}
.s-spring h2{color:var(--spring)} .s-summer h2{color:var(--summer)}
.s-autumn h2{color:var(--autumn)} .s-winter h2{color:var(--winter)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;margin-top:22px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(60,50,30,.14)}
.thumb{height:170px;position:relative;overflow:hidden}
.thumb img,.d-pic img{width:100%;height:100%;object-fit:cover;display:block}
.thumb,.d-pic{position:relative}
.thumb img,.d-pic img{position:absolute;inset:0}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ph .big{font-size:34px;letter-spacing:8px;color:#fff;font-weight:700}
.ph .tip{font-size:11px;color:rgba(255,255,255,.85);letter-spacing:1px}
.ph-spring{background:linear-gradient(135deg,#6ea88a,#3f6e54)}
.ph-summer{background:linear-gradient(135deg,#cf7a54,#a03a2a)}
.ph-autumn{background:linear-gradient(135deg,#d8a94e,#a06f1e)}
.ph-winter{background:linear-gradient(135deg,#6f92b4,#3a5a7c)}
.card .body{padding:14px 16px 16px}
.card .name{font-size:20px;letter-spacing:5px;font-weight:700}
.card .imagery{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 10px;border-radius:12px;border:1px solid var(--line);color:var(--ink2)}
.card .foot{margin-top:10px;font-size:12px;color:var(--ink2)}

/* ── 详情页 ── */
.detail{display:none;padding:36px 0 80px}
.d-head{display:flex;gap:30px;align-items:stretch;flex-wrap:wrap}
.d-pic{flex:0 0 380px;height:300px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.d-pic img,.d-pic .ph{width:100%;height:100%;object-fit:cover}
.d-info{flex:1;min-width:300px}
.d-info h1{font-size:38px;letter-spacing:10px}
.d-info .en{color:var(--ink2);font-size:13px;letter-spacing:2px;margin-top:2px}
.d-stats{margin-top:20px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.d-stats h3,.sec h3{font-size:16px;letter-spacing:3px;margin-bottom:12px;color:var(--seal)}
.bar-row{display:flex;align-items:center;gap:12px;margin:7px 0}
.bar-row .bn{width:80px;text-align:right;font-size:14px;flex-shrink:0}
.bar-row .track{flex:1;height:14px;background:#eee8d8;border-radius:7px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:7px}
.bar-row .fv{width:34px;font-size:13px;color:var(--ink2)}
.sec{margin-top:26px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.sec p{text-align:justify;text-indent:2em}
.poems{margin-top:26px}
.poem-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pf{padding:4px 16px;border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--ink2);cursor:pointer;background:var(--paper2);transition:.2s}
.pf.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.poem{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.poem .meta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.poem .meta b{font-size:17px;letter-spacing:2px}
.poem .meta .who{font-size:13px;color:var(--ink2)}
.dyn{font-size:11px;padding:1px 9px;border-radius:10px;background:#eee4cf;color:#7a5c1e}
.poem .text{margin-top:12px;white-space:pre-line;font-size:15px;text-align:justify}
.poem .imag{margin-top:12px;font-size:12.5px;color:var(--ink2)}
.poem .imag b{color:var(--seal);font-weight:600}
.back{display:inline-block;margin-bottom:22px;padding:6px 18px;border:1px solid var(--line);border-radius:18px;font-size:14px;color:var(--ink2);cursor:pointer}
.back:hover{background:var(--ink);color:var(--paper)}

/* ── 检索 / 凡例 ── */
.page{display:none;padding:40px 0 80px}
.search-bar{display:flex;gap:10px;margin-bottom:8px}
.search-bar input{flex:1;padding:12px 18px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;background:var(--paper2);color:var(--ink);outline:none}
.search-bar input:focus{border-color:var(--seal)}
.search-hint{font-size:12px;color:var(--ink2);margin-bottom:18px}
.fanli-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.fanli-row .k{flex:0 0 90px;color:var(--seal);font-weight:600}
.fanli-block{margin-top:26px}
footer{border-top:1px solid var(--line);padding:30px 0 40px;text-align:center;color:var(--ink2);font-size:13px;letter-spacing:1px}
@media(max-width:760px){
  .hero h1{font-size:30px;letter-spacing:6px}
  .d-pic{flex:1 1 100%}
  .hero .nums{gap:28px}
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand">节气诗境<small>唐宋元明清 · 诗词意象</small></div>
    <div class="nav-links">
      <a data-nav="home">总览</a>
      <a data-nav="search">检索</a>
      <a data-nav="fanli">凡例</a>
    </div>
  </div>
</header>

<!-- 首页 -->
<main id="view-home">
  <div class="wrap">
    <section class="hero">
      <div class="seal">节气诗境</div>
      <h1>廿四节气 · 诗词意象</h1>
      <p class="sub">从立春到大寒 —— 唐宋元明清五朝诗人笔下的时序流转与自然物候</p>
      <div class="nums">
        <div><b>24</b><span>节气</span></div>
        <div><b>270</b><span>诗词</span></div>
        <div><b>5</b><span>朝代</span></div>
      </div>
      <div class="divider"></div>
    </section>
    <div id="season-list"></div>
  </div>
</main>

<!-- 详情页 -->
<main id="view-detail" class="detail wrap"></main>

<!-- 检索页 -->
<main id="view-search" class="page wrap">
  <h2 style="letter-spacing:5px;margin-bottom:20px">诗 词 检 索</h2>
  <div class="search-bar"><input id="search-input" type="text" placeholder="搜索诗句、诗人、诗名、朝代或意象……"></div>
  <p class="search-hint">支持模糊匹配，例如：春雨 · 杜甫 · 梅 · 清明</p>
  <div id="search-results"></div>
</main>

<!-- 凡例页 -->
<main id="view-fanli" class="page wrap">
  <h2 style="letter-spacing:5px;margin-bottom:20px">凡 例 与 说 明</h2>
  <div id="fanli-body"></div>
</main>

<footer>
  节气诗境 · 唐宋元明清节气诗词意象与AI意象图像展<br>
  <span style="font-size:12px">据《人工分析唐宋元明清节气意象》整理 · 诗词数据共 270 首</span>
</footer>

<script src="data.js"></script>
<script>
const DATA = window.JIEQI_DATA;
const TERMS = DATA.terms;
const SEASONS = [
  {name:'春', en:'SPRING · 万物生发', cls:'spring', color:'var(--spring)'},
  {name:'夏', en:'SUMMER · 草木蕃庑', cls:'summer', color:'var(--summer)'},
  {name:'秋', en:'AUTUMN · 天地收肃', cls:'autumn', color:'var(--autumn)'},
  {name:'冬', en:'WINTER · 闭藏待春', cls:'winter', color:'var(--winter)'}
];
const $ = s => document.querySelector(s);

/* ── 图片：占位图垫底，images/序号.jpg（01-24 按节气顺序），失败自动摘除 ── */
function imageHTML(term){
  const ph = `<div class="ph ph-${term.season}"><div class="big">${term.name}</div><div class="tip">${term.season}季 · 意象图</div></div>`;
  const idx = String(TERMS.indexOf(term)+1).padStart(2,'0');
  return ph + `<img src="images/${idx}.jpg" alt="${term.name}" loading="lazy" onerror="this.onerror=null;this.remove()">`;
}

/* ── 首页 ── */
function renderHome(){
  const box = $('#season-list');
  box.innerHTML = SEASONS.map(s => {
    const ts = TERMS.filter(t => t.season === s.name);
    return `<section class="s-${s.cls}" id="season-${s.name}">
      <div class="season-head"><h2>${s.name}</h2><span class="tag">${s.en}</span><div class="rule"></div></div>
      <div class="cards">${ts.map(t => `
        <div class="card" onclick="openTerm('${t.name}')">
          <div class="thumb">${imageHTML(t)}</div>
          <div class="body">
            <div class="name">${t.name}</div>
            <div class="imagery">${t.stats.slice(0,4).map(x=>`<span class="chip">${x.name}×${x.freq}</span>`).join('')}</div>
            <div class="foot">${t.poems.length} 首 · 高频意象：${t.stats.slice(0,3).map(x=>x.name).join(' / ')}</div>
          </div>
        </div>`).join('')}
      </div>
    </section>`;
  }).join('');
}

/* ── 详情页 ── */
function openTerm(name){
  const t = TERMS.find(x => x.name === name);
  if(!t) return;
  const max = Math.max(...t.stats.map(s => s.freq), 1);
  const seasonColor = SEASONS.find(s => s.name === t.season).color;
  const dyns = [...new Set(t.poems.map(p => p.dyn))];
  const view = $('#view-detail');
  view.innerHTML = `
    <span class="back" onclick="show('home')">← 返回总览</span>
    <div class="d-head">
      <div class="d-pic">${imageHTML(t)}</div>
      <div class="d-info">
        <h1>${t.name}</h1>
        <div class="en">${t.season.toUpperCase()}/ ${t.season}季 · 收录诗词 ${t.poems.length} 首</div>
        <div class="d-stats">
          <h3>意象频次 · 本节气诗词中的核心自然物候</h3>
          ${t.stats.map(s => `
            <div class="bar-row">
              <div class="bn">${s.name}</div>
              <div class="track"><div class="fill" style="width:${Math.round(s.freq/max*100)}%;background:${seasonColor}"></div></div>
              <div class="fv">${s.freq}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="sec"><h3>情感特征</h3><p>${t.emotion || '暂缺'}</p></div>
    <div class="sec"><h3>文化内涵</h3><p>${t.culture || '暂缺'}</p></div>
    <div class="poems">
      <h3 style="font-size:16px;letter-spacing:3px;margin-bottom:12px;color:var(--seal)">诗 词 选 录</h3>
      <div class="poem-filter">
        <span class="pf on" data-dyn="all">全部 ${t.poems.length}</span>
        ${dyns.map(d => `<span class="pf" data-dyn="${d}">${d} ${t.poems.filter(p=>p.dyn===d).length}</span>`).join('')}
      </div>
      <div id="poem-list">
        ${t.poems.map((p,i) => `
          <div class="poem" data-dyn="${p.dyn}">
            <div class="meta"><b>${p.title}</b><span class="who">${p.dyn} · ${p.poet}</span><span class="dyn">${p.dyn}</span></div>
            <div class="text">${p.text}</div>
            ${p.img ? `<div class="imag">经典意象：<b>${p.img}</b></div>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
  view.querySelectorAll('.pf').forEach(el => {
    el.addEventListener('click', () => {
      view.querySelectorAll('.pf').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      const d = el.dataset.dyn;
      view.querySelectorAll('.poem').forEach(p => {
        p.style.display = (d === 'all' || p.dataset.dyn === d) ? '' : 'none';
      });
    });
  });
  show('detail');
  window.scrollTo(0,0);
}

/* ── 检索 ── */
function doSearch(q){
  q = q.trim().toLowerCase();
  const box = $('#search-results');
  if(!q){ box.innerHTML = ''; return; }
  const hits = [];
  TERMS.forEach(t => t.poems.forEach(p => {
    const hay = (p.title+p.poet+p.dyn+p.text+p.img+' '+t.name).toLowerCase();
    if(hay.includes(q)) hits.push({t,p});
  }));
  box.innerHTML = hits.length ? hits.map(({t,p}) => `
    <div class="poem">
      <div class="meta"><b>${p.title}</b><span class="who">${p.dyn} · ${p.poet}</span><span class="dyn">${p.dyn}</span>
      <span class="chip">${t.name}</span></div>
      <div class="text">${p.text}</div>
      ${p.img ? `<div class="imag">经典意象：<b>${p.img}</b></div>` : ''}
    </div>`).join('')
    : '<p style="color:var(--ink2);padding:30px 0;text-align:center">未找到匹配的诗词</p>';
}

/* ── 凡例 ── */
function renderFanli(){
  $('#fanli-body').innerHTML = DATA.fanli.map(([k,v]) =>
    `<div class="fanli-row"><div class="k">${k}</div><div style="flex:1">${v}</div></div>`).join('');
}

/* ── 视图切换 ── */
function show(name){
  ['home','detail','search','fanli'].forEach(v => {
    const el = $('#view-'+v);
    el.style.display = (v === name) ? (v==='home'?'block':'block') : 'none';
  });
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.classList.toggle('on', a.dataset.nav === name);
  });
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav-links a').forEach(a => {
  a.addEventListener('click', () => show(a.dataset.nav));
});
$('#search-input').addEventListener('input', e => doSearch(e.target.value));

/* ── 初始化 ── */
renderHome();
renderFanli();
show('home');
</script>
</body>
</html>
